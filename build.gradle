plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	implementation 'org.jsoup:jsoup:1.13.1'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.lootlookup'
version = '1.2.3'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	useJUnit()

	// Forward any -Dlootlookup.* flag from the Gradle CLI to the forked test JVM so
	// the opt-in live wiki-structure check can be enabled with, e.g.:
	//   ./gradlew test --tests "com.lootlookup.osrswiki.WikiStructureLiveTest" -Dlootlookup.livetest=true
	System.properties.each { k, v ->
		if (k.toString().startsWith('lootlookup.')) {
			systemProperty k.toString(), v.toString()
		}
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}
